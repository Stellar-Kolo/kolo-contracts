name: Kolo Contracts CI

permissions:
  contents: read

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: contracts

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIR }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (native)
        run: cargo build

      - name: Run tests
        run: cargo test --verbose

      - name: Build WebAssembly (release)
        run: cargo build --target wasm32v1-none --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kolo-savings-group-wasm
          path: ${{ env.WORKING_DIR }}/target/wasm32v1-none/release/kolo_savings_group.wasm
          retention-days: 14

  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIR }}

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v30.0.1

      - name: Verify Stellar CLI
        run: stellar --version

      - name: Build and optimize WASM
        run: |
          RUSTFLAGS="-C target-cpu=mvp" cargo build \
            --target wasm32v1-none \
            --release
          cargo install wasm-opt --locked
          wasm-opt \
            target/wasm32v1-none/release/kolo_savings_group.wasm \
            -o target/wasm32v1-none/release/kolo_savings_group.optimized.wasm

      - name: Deploy contract to testnet
        if: ${{ secrets.STELLAR_DEPLOYER_KEY != '' }}
        env:
          STELLAR_SOURCE_ACCOUNT: ${{ secrets.STELLAR_DEPLOYER_KEY }}
        run: |
          stellar contract deploy \
            --wasm target/wasm32v1-none/release/kolo_savings_group.optimized.wasm \
            --source-account "$STELLAR_SOURCE_ACCOUNT" \
            --network testnet

      - name: Skip notice
        if: ${{ secrets.STELLAR_DEPLOYER_KEY == '' }}
        run: echo "STELLAR_DEPLOYER_KEY is not configured on this repository; skipping Testnet deployment." >> "$GITHUB_STEP_SUMMARY"
